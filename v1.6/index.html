<!DOCTYPE html>
<!-- DoodleRun — the page shell: backdrop canvas, desktop-only overlay and the module entry point. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoodleRun</title>
<style>
html,body{height:100%}
body{margin:0;overflow:hidden;background:white;color:black;
font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
#backdrop{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}
.dr-desktop-only{display:none}
@media (max-width:959px){
.dr-desktop-only{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;
background:white;color:black;border:6px solid black}
.dr-desktop-only h2{margin:0;font-size:32px;font-weight:900;text-transform:uppercase;line-height:1}
.dr-desktop-only p{margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
}
</style>
</head>
<body>
<canvas id="backdrop" class="dr-demo" aria-hidden="true"></canvas>
<div class="dr-desktop-only">
<h2>DoodleRun needs a desktop window</h2>
<p>Open this on a screen at least 960 pixels wide, with a mouse or a trackpad.</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
